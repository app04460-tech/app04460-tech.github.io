<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アプリサポート</title>
<style>
  :root { --bg:#f7f9fb; --card:#ffffff; --text:#1a202c; --sub:#5a6572; --accent:#ff3b30; --line:#e3e8ee; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15181c; --card:#1f242a; --text:#e8ecf0; --sub:#9aa4ae; --line:#333a42; }
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
         background:var(--bg); color:var(--text); line-height:1.8; }
  .wrap { max-width:720px; margin:0 auto; padding:48px 20px 64px; }
  header h1 { font-size:1.5rem; margin-bottom:4px; }
  header p { color:var(--sub); font-size:.9rem; margin-bottom:32px; }
  header h1::after { content:""; display:block; width:56px; height:5px; border-radius:3px;
                     background:var(--accent); margin-top:10px; }
  .app { background:var(--card); border:1px solid var(--line); border-radius:12px;
         padding:20px 22px; margin-bottom:14px; }
  .app h2 { font-size:1.05rem; margin-bottom:2px; }
  .app p { color:var(--sub); font-size:.85rem; margin-bottom:10px; }
  .app a { display:inline-block; color:var(--accent); text-decoration:none; font-size:.9rem;
           margin-right:18px; font-weight:600; }
  .app a:hover { text-decoration:underline; }
  footer { margin-top:40px; color:var(--sub); font-size:.8rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>アプリサポート</h1>
    <p>公開中のiOSアプリのサポート・プライバシーポリシー一覧です。</p>
  </header>

  <div class="app">
    <h2>市区町村便覧</h2>
    <p>全国の市区町村を地図で引けるオフライン便覧アプリ</p>
    <a href="MunicipalitiesHandbook/support.html">サポート</a>
    <a href="MunicipalitiesHandbook/privacy.html">プライバシーポリシー</a>
  </div>

  <div class="app">
    <h2>人体構造図鑑</h2>
    <p>骨・筋・臓器の名前と位置を 3D 模型で確かめるオフライン図鑑</p>
    <a href="HumanAnatomyHandbook/support.html">サポート</a>
    <a href="HumanAnatomyHandbook/privacy.html">プライバシーポリシー</a>
  </div>

  <!-- 新しいアプリを追加するときは、上の .app ブロックをコピーして
       フォルダ名(プロジェクト名)とアプリ名を書き換えるだけです。
  <div class="app">
    <h2>アプリ名</h2>
    <p>ひとこと説明</p>
    <a href="ProjectName/support.html">サポート</a>
    <a href="ProjectName/privacy.html">プライバシーポリシー</a>
  </div>
  -->
</div>
</body>
</html>
